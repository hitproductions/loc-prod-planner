# Add these two services next to the existing n8n stack. They share nothing with n8n
# except the host and the reverse proxy.
#
# IMPORTANT: exactly ONE editing instance. It holds the re-plan preview and the book
# version in memory, so a second one would hand out preview tokens the other does not
# recognise. The read-only instance is safe to scale; it never writes.
services:
  planner:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: planner
    restart: unless-stopped
    environment:
      PORT: 8127
      PLANNER_SOURCE: sheets
      PLANNER_SHEET_ID: ${PLANNER_SHEET_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/planner-key.json
    volumes:
      # Read-only. Tara sends this file separately — it is a credential.
      - ./planner-key.json:/run/secrets/planner-key.json:ro
    expose:
      - "8127"

  planner-view:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: planner-view
    restart: unless-stopped
    environment:
      PORT: 8128
      PLANNER_SOURCE: sheets
      PLANNER_SHEET_ID: ${PLANNER_SHEET_ID}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/planner-key.json
      # THE boundary. Every write route answers 403 on this instance. A flag in the
      # browser is not a boundary; this is.
      PLANNER_READONLY: "1"
    volumes:
      - ./planner-key.json:/run/secrets/planner-key.json:ro
    expose:
      - "8128"
