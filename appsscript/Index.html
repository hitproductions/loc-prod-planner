<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<?!= include('Styles'); ?>
</head>
<body>

<div class="top">
  <div class="brand">Loc Prod Planner</div>
  <div class="nav">
    <button data-view="projects" class="on">Projects</button>
    <button data-view="schedule">Schedule</button>
    <button data-view="analysis">Analysis</button>
    <button data-view="replan">Re-plan</button>
  </div>
  <div class="right" id="topright"></div>
</div>

<main>
  <div class="view on" id="v-projects"><div class="loading">Reading the book…</div></div>
  <div class="view" id="v-schedule"></div>
  <div class="view" id="v-analysis"></div>
  <div class="view" id="v-replan"></div>
</main>

<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>

<?!= include('AnalysisView'); ?>

<script>
// ---------------------------------------------------------------- plumbing
var BOOT = null, EDITING = null, SCHED_MODE = 'project', PROJ_SORT = 'deadline',
    SCHED_RANGE = null, LOADED = {};

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function toast(msg, good){
  var t = $('toast');
  t.textContent = msg;
  t.className = 'toast' + (good ? ' good' : '');
  t.style.display = 'block';
  clearTimeout(t._h);
  t._h = setTimeout(function(){ t.style.display = 'none'; }, 7000);
}
function fail(e){ toast('Failed: ' + (e && e.message ? e.message : e)); }

function api(fn, args, ok){
  google.script.run.withSuccessHandler(ok).withFailureHandler(fail)[fn].apply(null, args || []);
}

// ---------------------------------------------------------------- routing
[].forEach.call(document.querySelectorAll('.nav button'), function(b){
  b.addEventListener('click', function(){ go(b.getAttribute('data-view')); });
});
function go(view){
  [].forEach.call(document.querySelectorAll('.nav button'), function(b){
    b.classList.toggle('on', b.getAttribute('data-view') === view); });
  [].forEach.call(document.querySelectorAll('.view'), function(v){
    v.classList.toggle('on', v.id === 'v-' + view); });
  if (view === 'schedule' && !LOADED.schedule) loadSchedule();
  if (view === 'analysis' && !LOADED.analysis) loadAnalysis();
  if (view === 'replan' && !LOADED.replan) renderReplanIdle();
}

// ---------------------------------------------------------------- boot
api('apiBootstrap', [], function(b){
  BOOT = b;
  renderTopRight();
  renderProjects();
});

// After any write, repaint every view rather than clearing LOADED and hoping the
// next navigation reloads them. The lazy version left Projects and Analysis showing
// the previous plan after a re-plan — the grid updated because it was the view you
// were looking at, and nothing else did. Two extra round trips is a fair price for
// never showing a stale schedule.
// `fresh` is the payload the write itself returned. Asking the server again is a
// separate execution that can start before the write is visible — the race that had
// Projects showing the previous plan three times over. Only fall back to a fetch if
// the caller has nothing to hand us.
function refreshEverything(fresh, then){
  if (typeof fresh === 'function') { then = fresh; fresh = null; }
  var paint = function(b){
    BOOT = b;
    LOADED = {};
    renderTopRight();
    renderProjects();
    loadSchedule();
    loadAnalysis();
    if (then) then();
  };
  if (fresh) paint(fresh); else api('apiBootstrap', [], paint);
}

function renderTopRight(){
  var c = BOOT.counts;
  var bits = [];
  bits.push('<span>Week of ' + esc(BOOT.today) + '</span>');
  bits.push('<span class="pill">' + c.projects + ' projects · ' + c.live_rows + ' bookings</span>');
  // Counted by depth, and worded as what it is. "Forced" was dropped: everywhere the
  // engine wrote it, it meant only "an overlap was accepted", and the note it was read
  // from missed most of them — five projects overlapped on the validation book, two
  // flagged. Two at once is normal and blue; three is overflow and red.
  var wks = function(n){ return n + (n === 1 ? ' week' : ' weeks'); };
  if (c.over2) bits.push('<span class="pill warn">' + wks(c.over2) + ' with 2 overlaps</span>');
  if (c.over3) bits.push('<span class="pill bad">' + wks(c.over3) + ' with 3+ overlaps</span>');
  if (c.pinned_rows) bits.push('<span class="pill">' + c.pinned_rows + ' pinned</span>');
  $('topright').innerHTML = bits.join('');
}

// ================================================================ PROJECTS
function renderProjects(){
  var v = $('v-projects');
  var ps = BOOT.projects || [];
  var html = '';

  if (BOOT.problems && BOOT.problems.length) {
    html += '<div class="errs"><b>The Bookings tab has ' + BOOT.problems.length +
      ' problem(s).</b> Figures may be wrong until they are fixed.<ul>' +
      BOOT.problems.slice(0,6).map(function(p){ return '<li>' + esc(p) + '</li>'; }).join('') +
      '</ul></div>';
  }
  if (BOOT.orphans && BOOT.orphans.length) {
    var orows = BOOT.orphans.reduce(function(n,o){ return n + o.rows; }, 0);
    html += '<div class="errs"><b>' + BOOT.orphans.length + ' project(s) are on the schedule ' +
      'but not in the Projects list.</b> Their rows were deleted from the Projects tab by hand, ' +
      'which leaves the bookings behind — the schedule is drawn from bookings. ' +
      '<ul>' + BOOT.orphans.map(function(o){
        return '<li>' + esc(o.project) + ' — ' + o.rows + ' booking row(s)</li>'; }).join('') +
      '</ul><button class="btn" id="orphanFix">Remove them from the schedule (' + orows + ' rows)</button>' +
      '<div class="hint">Marks those rows superseded. Nothing is deleted — they stay in the ' +
      'Bookings tab as history, exactly like a cancelled project.</div></div>';
  }
  if (!BOOT.engineers.length) {
    html += '<div class="errs"><b>No engineers on the roster.</b> Add them to the Engineers tab ' +
      'in the spreadsheet — every rule reads those flags.</div>';
  }

  html += '<div class="head"><span class="bar"></span><h2>Projects</h2></div>';
  html += '<div class="bar-row"><button class="btn primary" id="addBtn">+ Add project</button>' +
    '<div class="spacer"></div>' +
    '<button class="btn small' + (PROJ_SORT === 'deadline' ? ' primary' : '') +
      '" data-sort="deadline">Deadline</button>' +
    '<button class="btn small' + (PROJ_SORT === 'title' ? ' primary' : '') +
      '" data-sort="title">A\u2013Z</button>' +
    '<span class="muted" style="margin:0 0 0 12px">Click a row to edit it.</span></div>';

  html += '<div id="formHost"></div>';

  // Sorted here rather than server-side: it is a view preference, and re-fetching
  // 24 rows to reorder them would cost a round trip for nothing. A copy, because
  // BOOT.projects arrives in deadline order and the form relies on that.
  // numeric collation, so "Eps 3-4" sorts before "Eps 11-12" rather than after it
  var byTitle = function(a, b){
    return String(a.title).localeCompare(String(b.title), undefined, { numeric: true });
  };
  ps = ps.slice().sort(PROJ_SORT === 'title' ? byTitle : function(a, b){
    return String(a.deadline || '9999').localeCompare(String(b.deadline || '9999')) || byTitle(a, b);
  });

  if (!ps.length) {
    html += '<div class="empty">No projects yet. Add the first one.</div>';
  } else {
    // Dub and Edit are separate columns: the dub may be divided between two
    // engineers and the edit held by a third, so one "Record + edit" cell could
    // not say who actually did what.
    html += '<table class="projects"><thead><tr>' +
      '<th>Deadline</th><th>Project</th><th>Client</th><th class="dem">D/E/M</th>' +
      '<th class="who">Recordist</th><th class="who">Editor</th><th class="who">Mixer</th>' +
      '<th>Flags</th><th></th><th></th>' +
      '</tr></thead><tbody>';
    ps.forEach(function(p){
      // Only real overflow reddens the row. Two at once is normal enough that colouring
      // a third of the list red for it would train everyone to ignore the colour.
      var cls = (p.cancelled ? 'dim' : (p.overlap > 2 ? 'rowbad' : '')) + (p.locked ? ' locked' : '');
      var flags = '';
      if (p.overlap > 2) flags += '<span class="chip red">3 overlaps</span>';
      else if (p.overlap) flags += '<span class="chip warn">2 overlaps</span>';
      if (p.pinned) flags += '<span class="chip pin">pinned</span>';
      if (p.music) flags += '<span class="chip">music</span>';
      if (p.special) flags += '<span class="chip">special</span>';
      if (p.atmos) flags += '<span class="chip">atmos</span>';
      if (p.cancelled) flags += '<span class="chip">cancelled</span>';
      var dubs = [], edits = [], mixers = [];
      p.rows.forEach(function(r){
        var add = function(list){ if (list.indexOf(r.engineer) === -1) list.push(r.engineer); };
        if (r.phase === 'Mix') add(mixers);
        else if (r.phase === 'Edit') add(edits);
        else if (r.phase === 'Dub+Edit') { add(dubs); add(edits); }   // legacy rows
        else add(dubs);
      });
      // " + " matches how the engine labels a divided dub in its own note
      var dub = dubs.join(' + '), edit = edits.join(' + '), mix = mixers.join(' + ');
      html += '<tr class="' + cls + '" data-title="' + esc(p.title) + '">' +
        '<td>' + esc(p.deadline) + '</td>' +
        '<td class="tname">' + esc(p.title) + '</td>' +
        '<td>' + esc(p.client) + '</td>' +
        '<td class="dem">' + esc(p.phases) + '</td>' +
        '<td class="who">' + esc(dub || '—') + '</td>' +
        '<td class="who">' + esc(edit || '—') + '</td>' +
        '<td class="who">' + esc(mix || '—') + '</td>' +
        '<td>' + flags + '</td>' +
        '<td class="lockcell"><button class="lockbtn' + (p.locked ? ' on' : '') +
          '" data-lock="' + esc(p.title) + '" data-now="' + (p.locked ? '1' : '0') +
          '" title="' + (p.locked
            ? 'Frozen — a re-plan will not move this project. Click to unfreeze.'
            : 'Click to freeze: a re-plan will leave this project alone.') + '">' +
          (p.locked ? 'LOCKED' : 'Lock') + '</button></td>' +
        '<td><button class="btn small editBtn">Edit</button></td>' +
        '</tr>';
    });
    html += '</tbody></table>';
    html += '<div class="legend">' +
      '<span><span class="chip warn">2 overlaps</span> someone holds two of these weeks at ' +
        'once — normal, worth knowing</span>' +
      '<span><span class="chip red">3 overlaps</span> someone holds three at once — reassign</span>' +
      '<span><span class="chip pin">pinned</span> manual pick — the engine leaves it alone</span></div>';
  }

  v.innerHTML = html;
  $('addBtn').addEventListener('click', function(){ openForm(null); });
  [].forEach.call(v.querySelectorAll('[data-sort]'), function(b){
    b.addEventListener('click', function(){
      PROJ_SORT = b.getAttribute('data-sort');
      renderProjects();
    });
  });
  if ($('orphanFix')) $('orphanFix').addEventListener('click', function(){
    var titles = BOOT.orphans.map(function(o){ return o.project; });
    if (!confirm('Remove ' + titles.length + ' project(s) from the schedule?\n\n' +
        titles.join('\n') + '\n\nNothing is deleted.')) return;
    var btn = $('orphanFix');
    btn.disabled = true; btn.textContent = 'Removing…';
    api('apiSupersedeOrphans', [titles], function(res){
      if (!res.ok) { btn.disabled = false; btn.textContent = 'Failed — ' + res.error; return; }
      BOOT.orphans = res.orphans;
      api('apiBootstrap', [], function(b){ BOOT = b; LOADED = {}; renderProjects(); });
    });
  });
  [].forEach.call(v.querySelectorAll('.lockbtn'), function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      var title = btn.getAttribute('data-lock');
      var want = btn.getAttribute('data-now') !== '1';
      btn.disabled = true; btn.textContent = '…';
      api('apiSetProjectLock', [title, want], function(res){
        if (!res.ok) { btn.disabled = false; toast(res.error || 'Failed'); return; }
        BOOT.projects = res.projects;
        renderProjects();
        toast(title + (res.locked ? ' frozen — re-plan will skip it.' : ' unfrozen.'), true);
      });
    });
  });
  [].forEach.call(v.querySelectorAll('.editBtn'), function(btn){
    btn.addEventListener('click', function(e){
      e.stopPropagation();
      openForm(btn.closest('tr').getAttribute('data-title'));
    });
  });
}

// ---- the add / edit form -------------------------------------------------
function formHtml(mode){
  var editing = mode === 'edit';
  return '<div class="form' + (editing ? ' editing' : '') + '">' +
    '<h3>' + (editing ? 'Correct project' : 'Add project') + '</h3>' +
    '<div class="note">' + (editing
      ? 'Change anything, including the name. Saving supersedes this project’s current bookings and re-plots it — nothing is deleted.'
      : 'Check availability first if you are deciding whether to take the job.') + '</div>' +
    '<div class="fields">' +
      '<div class="f wide"><label for="f_title">Project</label>' +
        '<input type="text" id="f_title" autocomplete="off"></div>' +
      '<div class="f"><label for="f_client">Client</label><select id="f_client"></select></div>' +
      '<div class="f"><label for="f_deadline">Deadline</label>' +
        '<input type="date" id="f_deadline"></div>' +
      '<div class="f wide"><label>Weeks per phase</label>' +
        '<div class="phases">' +
          '<div class="p"><input type="number" id="f_dub" min="0" max="52" value="0">' +
            '<div class="hint"><span class="sw" style="background:var(--dub)"></span>Dub</div></div>' +
          '<div class="p"><input type="number" id="f_edit" min="0" max="52" value="0">' +
            '<div class="hint"><span class="sw" style="background:var(--edit)"></span>Edit</div></div>' +
          '<div class="p"><input type="number" id="f_mix" min="0" max="52" value="0">' +
            '<div class="hint"><span class="sw" style="background:var(--mix)"></span>Mix</div></div>' +
        '</div>' +
        '<div class="hint">Zero is valid — the phase does not exist. Phases plot backward from the deadline.</div>' +
      '</div>' +
      '<div class="f"><label for="f_level">Mix level</label><select id="f_level">' +
        '<option value="Advanced">Advanced</option><option value="Developing">Developing</option>' +
        '</select></div>' +
      '<div class="f"><label>Flags</label><div class="checks">' +
        '<label><input type="checkbox" id="f_music"> Music</label>' +
        '<label><input type="checkbox" id="f_special"> Special</label>' +
        '<label><input type="checkbox" id="f_atmos"> Atmos</label>' +
        '</div><div class="hint">Atmos is separate from Special: it means the mix needs ' +
        'the room, and only engineers who have it will be given the job.</div></div>' +
      '<div class="f"><label for="f_rec">Recordist pick</label><select id="f_rec"></select>' +
        '<div class="hint">Auto lets the engine choose.</div></div>' +
      '<div class="f"><label for="f_rec2">Second recordist</label><select id="f_rec2"></select>' +
        '<div class="hint">Splits the dub between the two, first name taking the earlier ' +
        'weeks. Dub only — the edit stays whole.</div></div>' +
      '<div class="f"><label for="f_ed">Editor pick</label><select id="f_ed"></select>' +
        '<div class="hint">Auto keeps the edit with the recordist. Name someone to split them.</div></div>' +
      '<div class="f"><label for="f_mixer">Mixer pick</label><select id="f_mixer"></select>' +
        '<div class="hint">A manual pick overrides every rule and is always flagged on the schedule.</div></div>' +
    '</div>' +
    '<div class="formactions">' +
      '<button class="btn" id="f_check">Check availability</button>' +
      '<button class="btn primary" id="f_save">' + (editing ? 'Save & re-plot' : 'Plot & save') + '</button>' +
      '<button class="btn" id="f_close">Close</button>' +
      '<div class="spacer"></div>' +
      (editing ? '<button class="btn danger" id="f_cancel">Cancel project</button>' : '') +
    '</div>' +
    '<div id="f_out"></div>' +
  '</div>';
}

function openForm(title){
  EDITING = title || null;
  $('formHost').innerHTML = formHtml(title ? 'edit' : 'add');

  var cs = $('f_client');
  (BOOT.clients.length ? BOOT.clients : ['Netflix']).forEach(function(n){
    cs.appendChild(new Option(n, n));
  });
  ['f_rec','f_rec2','f_ed','f_mixer'].forEach(function(id){
    var s = $(id);
    s.appendChild(new Option('Auto','Auto'));
    BOOT.engineers.forEach(function(n){ s.appendChild(new Option(n, n)); });
  });

  $('f_check').addEventListener('click', function(){ submit('apiCheckProject', 'Checking…'); });
  $('f_save').addEventListener('click', function(){
    if (!confirmLosingHandPlaced(title)) return;
    submit('apiSaveProject', 'Plotting…');
  });
  $('f_close').addEventListener('click', function(){ $('formHost').innerHTML = ''; EDITING = null; });
  if (title) $('f_cancel').addEventListener('click', cancelProject);

  if (title) {
    api('apiGetProject', [title], function(p){
      if (!p.found) { toast('Could not load ' + title); return; }
      $('f_title').value = p.title;
      $('f_client').value = p.client || 'Netflix';
      $('f_deadline').value = p.deadline || '';
      $('f_dub').value = p.dub || 0;
      $('f_edit').value = p.edit || 0;
      $('f_mix').value = p.mix || 0;
      $('f_level').value = p.mix_level || 'Advanced';
      $('f_music').checked = !!p.music;
      $('f_special').checked = !!p.special;
      $('f_atmos').checked = !!p.atmos;
      $('f_rec').value = p.recordist || 'Auto';
      $('f_rec2').value = p.recordist2 || 'Auto';
      $('f_ed').value = p.editor || 'Auto';
      $('f_mixer').value = p.mixer || 'Auto';
      $('f_title').focus();
    });
  } else {
    $('f_title').focus();
  }
  $('formHost').scrollIntoView({ block:'nearest' });
}

function payload(){
  return {
    title: $('f_title').value,
    original_title: EDITING || '',
    client: $('f_client').value,
    deadline: $('f_deadline').value,
    dub: $('f_dub').value, edit: $('f_edit').value, mix: $('f_mix').value,
    mix_level: $('f_level').value,
    music: $('f_music').checked,
    special: $('f_special').checked,
    atmos: $('f_atmos').checked,
    recordist: $('f_rec').value,
    recordist2: $('f_rec2').value,
    editor: $('f_ed').value,
    mixer: $('f_mixer').value
  };
}

var FIELD_IDS = ['f_title','f_deadline','f_dub','f_edit','f_mix','f_level'];
function markErrors(errors){
  FIELD_IDS.forEach(function(id){ $(id).classList.remove('bad'); });
  errors.forEach(function(m){
    if (/title/i.test(m)) $('f_title').classList.add('bad');
    if (/deadline/i.test(m)) $('f_deadline').classList.add('bad');
    if (/mix level/i.test(m)) $('f_level').classList.add('bad');
    if (/phase|whole numbers|at least one/i.test(m))
      ['f_dub','f_edit','f_mix'].forEach(function(id){ $(id).classList.add('bad'); });
  });
}

// A re-plot rebuilds a project's bookings from its Projects row, which has no way
// to record "this person, this week" — so any week moved by hand in the Schedule
// goes back to automatic. That is usually the right answer (you are changing the
// deadline or the phase lengths, so the hand-placed week may not mean anything any
// more), but it must not be a surprise. Silent only when there is nothing to lose.
function confirmLosingHandPlaced(title){
  if (!title) return true;                       // a new project has no bookings yet
  var p = (BOOT.projects || []).filter(function(x){ return x.title === title; })[0];
  if (!p || !p.rows) return true;
  var hand = p.rows.filter(function(r){ return /moved by hand/i.test(r.note || ''); });
  if (!hand.length) return true;
  return confirm(
    'Saving will undo ' + hand.length + ' week' + (hand.length === 1 ? '' : 's') +
    ' you moved by hand:\n\n' +
    hand.map(function(r){ return '  • ' + r.phase + ' — ' + r.engineer + ', week of ' + r.start; }).join('\n') +
    '\n\nGo ahead?');
}

function submit(fn, label){
  FIELD_IDS.forEach(function(id){ $(id).classList.remove('bad'); });
  $('f_check').disabled = true; $('f_save').disabled = true;
  $('f_out').innerHTML = '<div class="muted">' + label + '</div>';
  google.script.run
    .withSuccessHandler(function(res){
      $('f_check').disabled = false; $('f_save').disabled = false;
      showResult(res);
      if (res.ok && !res.dry_run) {
        BOOT.projects = res.projects || BOOT.projects;
        LOADED = {};                                  // schedule/analysis are stale now
        api('apiBootstrap', [], function(b){ BOOT = b; renderTopRight(); });
        toast((res.renamed ? 'Renamed and re-plotted' : 'Plotted') + ' — ' + res.title +
              (res.superseded ? ' · ' + res.superseded + ' old row(s) superseded' : ''),
              !(res.overlap > 2));   // a two-way is not a failed save
      }
    })
    .withFailureHandler(function(e){
      $('f_check').disabled = false; $('f_save').disabled = false;
      $('f_out').innerHTML = '<div class="errs"><b>Failed.</b><br>' + esc(e.message||e) + '</div>';
    })[fn](payload());
}

var PHASE_BG = {'Dub':'var(--dub)','Edit':'var(--edit)','Mix':'var(--mix)','Dub+Edit':'var(--dub)'};

function showResult(res){
  var out = $('f_out');
  if (!res.ok) {
    markErrors(res.errors || []);
    out.innerHTML = '<div class="errs"><b>Not plotted.</b><ul>' +
      (res.errors||[]).map(function(e){ return '<li>' + esc(e) + '</li>'; }).join('') + '</ul></div>';
    return;
  }
  // Only real overflow gets the alarm treatment. A dry run knows an overlap is coming
  // but not how deep it will land, so it is read as a pair — the cautious reading, since
  // it warns without crying wolf.
  var deep = res.overlap || (res.forced ? 2 : 0);
  var cls = 'result ' + (deep > 2 ? 'alarm' : (res.dry_run ? 'dry' : 'saved'));
  var head = res.dry_run ? 'Availability check — nothing was written'
    : 'Saved' + (res.renamed ? ' · renamed from "' + esc(res.renamed) + '"' : '') +
      (res.superseded ? ' · ' + res.superseded + ' old row(s) superseded' : '');
  var h = '<div class="' + cls + '"><h4>' + head + '</h4>' +
    '<div class="kv"><b>Recordist</b><span>' + esc(res.dubber || res.recordist) + '</span></div>' +
    '<div class="kv"><b>Editor</b><span>' + esc(res.editor || res.recordist) + '</span></div>' +
    '<div class="kv"><b>Mixer</b><span>' + esc(res.mixer) + '</span></div>';
  if (res.dry_run && res.replaces)
    h += '<div class="kv"><b>Replaces</b><span>' + res.replaces + ' existing booking row(s)</span></div>';
  if (res.rows && res.rows.length) {
    h += '<table style="margin-top:10px"><thead><tr><th>Phase</th><th>Engineer</th>' +
      '<th>From</th><th>To</th></tr></thead><tbody>';
    res.rows.forEach(function(r){
      h += '<tr><td><span class="sw" style="background:' + (PHASE_BG[r.phase]||'transparent') + '"></span>' +
        esc(r.phase) + '</td><td>' + esc(r.engineer) + '</td><td>' + esc(r.start) +
        '</td><td>' + esc(r.end) + '</td></tr>';
    });
    h += '</tbody></table>';
  }
  if (deep > 2)
    h += '<div class="warn">THREE AT ONCE — someone now holds three bookings in the same ' +
         'week to hit this deadline. Reassign one of them.</div>';
  else if (deep)
    h += '<div class="warn soft">Two at once — someone doubles up for part of this run. ' +
         'Normal where a shoot is still recording while its edit starts; worth a look if not.</div>';
  if (res.warnings) h += '<div class="warn">' + esc(res.warnings) + '</div>';
  if (res.record_note || res.mix_note)
    h += '<div class="muted">' + esc([res.record_note,res.mix_note].filter(Boolean).join(' · ')) + '</div>';
  if (res.dry_run)
    h += '<div class="muted">Nothing saved yet. Press Plot &amp; save to commit, or change the deadline or weeks and check again.</div>';
  h += '</div>';
  out.innerHTML = h;
  if (res.ok && !res.dry_run) renderProjects();
}

function cancelProject(){
  var title = EDITING;
  if (!title) return;
  var p = (BOOT.projects || []).filter(function(x){ return x.title === title; })[0];
  var n = p ? p.live_rows : 0;
  if (!window.confirm('Cancel "' + title + '"?\n\n' + n + ' booking row(s) will be superseded so it ' +
      'leaves the schedule. Nothing is deleted — the rows stay on the Bookings tab as history.')) return;
  api('apiCancelProject', [title], function(res){
    if (!res.ok) { toast((res.errors||['Failed']).join(' ')); return; }
    BOOT.projects = res.projects || BOOT.projects;
    LOADED = {};
    $('formHost').innerHTML = ''; EDITING = null;
    api('apiBootstrap', [], function(b){ BOOT = b; renderTopRight(); renderProjects(); });
    toast('Cancelled ' + res.removed + ' — ' + res.superseded + ' row(s) superseded', true);
  });
}

// ================================================================ SCHEDULE
function loadSchedule(){
  $('v-schedule').innerHTML = '<div class="loading">Building the grid…</div>';
  api('apiSchedule', [SCHED_MODE, SCHED_RANGE], function(d){ LOADED.schedule = true; renderSchedule(d); });

// Column tracking for the grid. Delegated, and it only ever touches the column being
// left and the column being entered — 24 class toggles per move rather than 1,400.
function wireColumnHover(wrap){
  var current = null;
  var mark = function(ci, on){
    if (ci === null) return;
    var sel = '[data-c="' + ci + '"]';
    [].forEach.call(wrap.querySelectorAll(sel), function(el){
      el.classList.toggle('colhi', on);
    });
  };
  wrap.addEventListener('mouseover', function(e){
    var td = e.target.closest('[data-c]');
    var ci = td ? td.getAttribute('data-c') : null;
    if (ci === current) return;
    mark(current, false);
    current = ci;
    mark(current, true);
  });
  wrap.addEventListener('mouseleave', function(){ mark(current, false); current = null; });
}

// weeks ACROSS, one row per project
function projectGrid(d){
  var h = '<div class="gridwrap"><table class="sched"><thead>';
  var months = [], last = null;
  d.weeks.forEach(function(w){
    if (w.month !== last) { months.push({ m: w.month, n: 1 }); last = w.month; }
    else months[months.length-1].n++;
  });
  h += '<tr class="monthband"><th class="corner">Project</th>';
  months.forEach(function(m){ h += '<th colspan="' + m.n + '">' + esc(m.m) + '</th>'; });
  h += '</tr><tr><th class="corner"></th>';
  d.weeks.forEach(function(w, ci){ h += '<th data-c="' + ci + '">' + esc(w.day_range) + '</th>'; });
  h += '</tr></thead><tbody>';

  d.labels.forEach(function(label, ri){
    h += '<tr><th title="' + esc(label) + '">' + esc(label) + '</th>';
    d.cells[ri].forEach(function(c, ci){
      h += cellHtml(c, {
        ci: ci,
        marker: (d.markers || []).some(function(m){ return m.row === ri && m.col === ci; }),
        text: c ? c.text : '',
        tip: d.weeks[ci].label
      });
    });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

// weeks DOWN, one column per engineer
function engineerGrid(d){
  LAST_YEAR_SEEN = null;
  var h = '<div class="gridwrap tall"><table class="sched byeng"><thead><tr>' +
    '<th class="corner">Week</th>';
  d.labels.forEach(function(name, ri){
    h += '<th data-c="' + ri + '" title="' + esc(name) + '">' + esc(name) + '</th>';
  });
  h += '</tr></thead><tbody>';

  // Rules mark QUARTERS, not months. A monthly rule sat next to monthly labels and
  // disagreed with them four times a year: the week 08/31 - 09/06 is mostly September
  // but starts in August, so the line landed below it. Quarters make no claim the row
  // labels can contradict, and they are the unit the range picker and Analysis already
  // use. The months are still legible without a rule — zero-padded tabular figures put
  // the month digits in an aligned column, so 08 → 09 is visible in the text itself.
  var lastQuarter = null;
  d.weeks.forEach(function(w, ci){
    var startsQuarter = w.quarter !== lastQuarter;
    lastQuarter = w.quarter;
    var cls = [];
    if (startsQuarter) cls.push('qstart');
    if (ci === d.today_week) cls.push('nowrow');
    h += '<tr' + (cls.length ? ' class="' + cls.join(' ') + '"' : '') + '>' +
      '<th title="' + esc(w.label) + '">' + esc(weekNumeric(w)) + '</th>';
    d.labels.forEach(function(name, ri){
      var c = d.cells[ri][ci];                       // transposed read
      h += cellHtml(c, { ci: ri, marker: false,
                         text: c ? c.text : '', tip: w.label + ' · ' + name,
                         drag: { eng: name, week: w.start } });
    });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

// MM/DD - MM/DD, the way dates are written in the PH. Year appended only when it
// changes, since the horizon crosses one new year and stamping '26 on all 58 rows is
// ink for a single moment of ambiguity.
//
// Constructed in UTC from the YYYY-MM-DD string: a local-time Date would shift the
// week into the wrong month for anyone west of Manila.
var LAST_YEAR_SEEN = null;
function weekNumeric(w){
  var iso = String(w.start || w.week_start || '');
  if (!/^\d{4}-\d{2}-\d{2}$/.test(iso)) return w.day_range || '';
  var y = +iso.slice(0,4), m = +iso.slice(5,7), day = +iso.slice(8,10);
  var end = new Date(Date.UTC(y, m - 1, day + 6));
  var em = end.getUTCMonth() + 1, ed = end.getUTCDate(), ey = end.getUTCFullYear();
  // Both months, always. "9/7 - 13" makes you infer that 13 is September; "9/7 - 9/13"
  // does not, and every label ends up the same shape so the eye stops parsing it.
  // The column already had to fit the year case, so the second month costs nothing.
  // Zero-padded — the local convention, and it makes every label exactly the same
  // width, so with tabular figures the slashes line up down all 58 rows.
  var pad = function(n){ return (n < 10 ? '0' : '') + n; };
  var label = pad(m) + '/' + pad(day) + ' - ' + pad(em) + '/' + pad(ed);
  if (String(ey) !== LAST_YEAR_SEEN) { label += " '" + String(ey).slice(2); LAST_YEAR_SEEN = String(ey); }
  return label;
}

// One cell, both orientations. data-c is whatever the COLUMN means in this mode —
// a week in Projects mode, an engineer in Engineers mode — so the hover tracking
// works unchanged in both.
function cellHtml(c, o){
  var cls = [], style = '';
  var text = '';
  if (c) {
    cls.push('cell');
    text = o.text;
    // Depth decides the colour: two at once is a blue warning, three or more is red
    // overflow. The fill covers a cell holding several bookings; the outline covers a
    // cell that looks clean but whose engineer is stretched elsewhere that week.
    var deep = c.depth || c.count || 1;
    if (c.count > 1) cls.push(deep > 2 ? 'dbl3' : 'dbl2');
    else style = 'background:' + ({'Dub':'#FFC000','Edit':'#BDD7EE','Mix':'#EA9999','Dub+Edit':'#FFC000'}[c.phase] || 'transparent');
    if (c.overlap) cls.push(deep > 2 ? 'over3' : 'over2');
    if (c.manual) cls.push('pinned');
  } else if (o.marker) {
    cls.push('marker'); text = '\u25B2';
  }
  var tip = (c ? c.text + ' · ' + c.phase +
    (c.overlap ? ' · ' + (c.depth || c.count) + ' overlaps this week' : '') +
    (c.manual ? ' · manual pick' : '') : '') + ' — ' + o.tip;

  // In Engineers mode the cell is a DROP TARGET (an engineer + a week) and each
  // booking inside it is separately DRAGGABLE. They have to be separate elements:
  // a cell holding two bookings is one square on screen but two different things
  // you might mean, and dragging "the cell" would silently pick one of them.
  var body = esc(text);
  if (o.drag) {
    if (c && c.items && c.items.length) {
      body = c.items.map(function(it, i){
        return '<span class="bk" draggable="true"' +
               ' data-p="' + esc(it.p) + '" data-ph="' + esc(it.ph) + '"' +
               ' data-from="' + esc(o.drag.eng) + '" data-wk="' + esc(o.drag.week) + '"' +
               (it.hand ? ' data-hand="1" title="Moved by hand"' : '') + '>' +
               esc(c.items.length > 1 ? it.p : text) + '</span>';
      }).join('<span class="bksep"> / </span>');
    }
    return '<td data-c="' + o.ci + '" class="' + cls.join(' ') + '"' +
      ' data-eng="' + esc(o.drag.eng) + '" data-wk="' + esc(o.drag.week) + '"' +
      (style ? ' style="' + style + '"' : '') + ' title="' + esc(tip) + '">' + body + '</td>';
  }
  return '<td data-c="' + o.ci + '" class="' + cls.join(' ') + '"' +
    (style ? ' style="' + style + '"' : '') + ' title="' + esc(tip) + '">' + esc(text) + '</td>';
}

function renderSchedule(d){
  var v = $('v-schedule');
  if (d.empty) {
    v.innerHTML = '<div class="empty">No bookings yet. Add a project first.</div>';
    return;
  }
  var byProject = d.mode === 'project';
  var h = '<div class="head"><span class="bar"></span><h2>Schedule</h2></div>';
  h += '<div class="bar-row">' +
    '<button class="btn small' + (byProject ? ' primary' : '') + '" data-mode="project">Projects</button>' +
    '<button class="btn small' + (!byProject ? ' primary' : '') + '" data-mode="engineer">Engineers</button>' +
    '<div class="spacer"></div>' + rangePicker(d) +
    '<span class="muted" style="margin:0 0 0 12px">' + d.weeks.length + ' weeks</span></div>';

  // quarter band + week header
  // Two orientations, on purpose. Projects mode runs weeks ACROSS: a project is a bar
  // and you read it left to right. Engineers mode runs weeks DOWN, because its cells
  // hold PROJECT names — the week columns widened to fit them and the table reached
  // 7,749px, 5.2x the screen, so seeing one year meant scrolling five screens
  // sideways. Transposed it is ~8 columns wide and scrolls vertically, which is free.
  //
  // The transpose happens here rather than on the server: apiSchedule keeps returning
  // cells[labelIndex][weekIndex] for both modes, so its contract and its tests are
  // untouched.
  h += byProject ? projectGrid(d) : engineerGrid(d);
  h += '<div class="legend">' +
    '<span><span class="sw" style="background:var(--dub)"></span>Dub</span>' +
    '<span><span class="sw" style="background:var(--edit)"></span>Edit</span>' +
    '<span><span class="sw" style="background:var(--mix)"></span>Mix</span>' +
    (byProject
      ? '<span><span class="sw" style="background:var(--red)"></span>Deadline week</span>'
      : '<span><span class="sw" style="background:var(--warn)"></span>2 at once</span>' +
        '<span><span class="sw" style="background:var(--red)"></span>3 at once</span>') +
    '<span><span class="sw" style="border:2px solid var(--warn);background:transparent"></span>' +
      '2 overlaps this week</span>' +
    '<span><span class="sw" style="border:2px solid var(--red);background:transparent"></span>' +
      '3 overlaps — reassign</span>' +
    '<span><span class="sw" style="border:2px dotted var(--fg1);background:transparent"></span>' +
      'manual pick</span></div>';

  h += byProject ? '' :
    '<p class="muted hint">Click a week to see what it holds and why. ' +
    'Drag a booking sideways to give that week to someone else — weeks never move, ' +
    'only who does them. A week you have moved shows a dotted outline, and the panel ' +
    'can hand it back to automatic.</p>';

  v.innerHTML = h;
  var wrap = v.querySelector('.gridwrap');
  if (wrap) wireColumnHover(wrap);
  if (wrap && !byProject) wireDrag(wrap);
  [].forEach.call(v.querySelectorAll('[data-mode]'), function(b){
    b.addEventListener('click', function(){
      SCHED_MODE = b.getAttribute('data-mode');
      loadSchedule();
    });
  });
  var qf = $('qFrom'), qt = $('qTo');
  if (qf && qt) {
    var apply = function(){
      var f = qf.value, t = qt.value;
      // keep the ends the right way round rather than returning nothing
      if (f && t && f > t) { if (this === qt) qf.value = t; else qt.value = f; f = qf.value; t = qt.value; }
      SCHED_RANGE = (f || t) ? { from: f || null, to: t || null } : null;
      loadSchedule();
    };
    qf.addEventListener('change', apply);
    qt.addEventListener('change', apply);
  }
  if ($('qAll')) $('qAll').addEventListener('click', function(){ SCHED_RANGE = null; loadSchedule(); });
}

// Drag one week of one phase to another engineer.
//
// Horizontal only, and that is not a stylistic choice: a row IS a week, so a
// vertical drag would mean moving work in time, and dates come from the deadline —
// they are the one thing the tool never negotiates. Dropping on another row is
// refused outright rather than quietly reinterpreted as "same week, that column".
var DRAG = null;
function wireDrag(wrap){
  var clear = function(){
    [].forEach.call(wrap.querySelectorAll('.dropok,.dropno,.dragging'), function(el){
      el.classList.remove('dropok'); el.classList.remove('dropno'); el.classList.remove('dragging');
    });
  };

  [].forEach.call(wrap.querySelectorAll('.bk'), function(el){
    el.addEventListener('dragstart', function(ev){
      DRAG = { p: el.getAttribute('data-p'), ph: el.getAttribute('data-ph'),
               from: el.getAttribute('data-from'), wk: el.getAttribute('data-wk'),
               row: el.closest('tr') };
      el.classList.add('dragging');
      // Some browsers refuse to start a drag with no payload set.
      try { ev.dataTransfer.setData('text/plain', DRAG.p); } catch (e) {}
      ev.dataTransfer.effectAllowed = 'move';
    });
    el.addEventListener('dragend', function(){ DRAG = null; clear(); });
  });

  // Click a hand-placed week to give it back to the tool. This is not discoverable —
  // nothing on screen says a click does anything — which is why it briefly moved into
  // a detail panel. The panel was removed (2026-08-30, too heavy for the view), so the
  // click is the only undo again. The dotted outline and the tooltip are the whole
  // affordance, and the hint under the grid spells it out.
  [].forEach.call(wrap.querySelectorAll('.bk[data-hand]'), function(el){
    el.addEventListener('click', function(ev){
      ev.stopPropagation();
      var proj = el.getAttribute('data-p'), ph = el.getAttribute('data-ph'),
          wk = el.getAttribute('data-wk');
      if (!confirm('Give this week back to the tool?\n\n' + proj + ' \u00b7 ' + ph +
                   '\nweek of ' + wk + '\n\nYour other manual changes stay.')) return;
      api('apiUndoWeekMove', [{ project: proj, phase: ph, week_start: wk }], function(res){
        if (!res || !res.ok) { toast((res && res.error) || 'Could not undo that.'); return; }
        toast(proj + ' \u00b7 ' + ph + ' \u2014 back with ' + res.to + ', automatic again.' +
              ((res.clash && res.clash.length) ? '  Note: ' + res.to + ' also has ' +
                res.clash.join(' and ') + ' that week.' : ''), true);
        refreshEverything(res.boot);
      });
    });
  });

  [].forEach.call(wrap.querySelectorAll('td[data-eng]'), function(td){
    td.addEventListener('dragover', function(ev){
      if (!DRAG) return;
      var sameWeek = td.closest('tr') === DRAG.row;
      var sameEng = td.getAttribute('data-eng') === DRAG.from;
      if (sameWeek && !sameEng) {
        ev.preventDefault();                       // preventDefault IS "yes, drop here"
        ev.dataTransfer.dropEffect = 'move';
        td.classList.add('dropok');
      } else if (!sameWeek) {
        td.classList.add('dropno');                // a different week: never allowed
      }
    });
    td.addEventListener('dragleave', function(){
      td.classList.remove('dropok'); td.classList.remove('dropno');
    });
    td.addEventListener('drop', function(ev){
      ev.preventDefault();
      if (!DRAG || td.closest('tr') !== DRAG.row) { clear(); return; }
      var to = td.getAttribute('data-eng');
      var move = { project: DRAG.p, phase: DRAG.ph, week_start: DRAG.wk, to_engineer: to };
      var from = DRAG.from;
      DRAG = null; clear();
      confirmMove(move, from);
    });
  });
}

// ---------------------------------------------------------------- week detail panel
// A click selects an engineer-week; a drag still moves a booking. The two coexist
// because a completed drag fires no click.
// Two server calls on purpose: the first asks what the move would cost and writes
// nothing, the second commits. The alternative — warning from data the client
// already holds — would put the eligibility rules in two places and let them drift.
function confirmMove(move, from){
  api('apiReassignWeek', [move], function(r){
    if (!r || !r.ok) { toast((r && r.error) || 'Could not move that.'); return; }

    var lines = [move.project + ' · ' + move.phase,
                 'week of ' + move.week_start, '',
                 from + '  →  ' + move.to_engineer, ''];
    if (r.warnings && r.warnings.length) {
      r.warnings.forEach(function(w){ lines.push('• ' + w.text); });
    } else {
      lines.push(move.to_engineer + ' is free that week.');
    }
    lines.push('');
    lines.push('Only this week moves.');
    if (!confirm(lines.join('\n'))) return;
    move.confirmed = true;
    api('apiReassignWeek', [move], function(res){
      if (!res || !res.ok) { toast((res && res.error) || 'Could not move that.'); return; }
      toast(move.project + ' · ' + move.phase + ' — that week is now ' + move.to_engineer + '.', true);
      refreshEverything(res.boot);
    });
  });
}

// Who is doubled, which week, on which titles — before and after, side by side.
// A count cannot be acted on; a name, a week and two project titles can.
function overlapTable(r){
  var after = r.overlaps_after || [], fixed = r.overlaps_resolved || [];
  if (!after.length && !fixed.length) {
    return '<div class="banner">Nobody holds more than one project in a week, either ' +
           'way.</div>';
  }
  var rowsHtml = '';
  fixed.forEach(function(o){
    rowsHtml += '<tr class="dim"><td>' + esc(o.label) + '</td><td>' + esc(o.engineer) + '</td>' +
      '<td>' + esc(o.projects.join('  +  ')) + '</td>' +
      '<td><span class="chip">resolved</span></td></tr>';
  });
  after.forEach(function(o){
    rowsHtml += '<tr' + (o.projects.length > 2 ? ' class="rowbad"' : '') + '><td>' + esc(o.label) + '</td>' +
      '<td>' + esc(o.engineer) + '</td>' +
      '<td>' + esc(o.projects.join('  +  ')) + '</td>' +
      '<td>' + (o.isNew ? '<span class="chip red">new</span>' : '<span class="chip">stays</span>') +
      (o.projects.length > 2 ? '<span class="chip red">' + o.projects.length + ' at once</span>'
                             : '<span class="chip warn">2 at once</span>') + '</td></tr>';
  });
  var n = after.filter(function(o){ return o.isNew; }).length;
  var deepN = after.filter(function(o){ return o.projects.length > 2; }).length;
  return '<h3 style="margin-top:26px">Who would be holding more than one, week by week</h3>' +
    '<p class="muted" style="margin-top:0">' + fixed.length + ' resolved · ' +
    (after.length - n) + ' unchanged · ' + n + ' newly created' +
    (deepN ? ' · ' + deepN + ' at three or more' : '') + '. ' +
    'Two at once is ordinary; three is overflow and wants reassigning.</p>' +
    '<table class="projects"><thead><tr><th>Week</th><th>Engineer</th>' +
    '<th>Projects colliding</th><th></th></tr></thead><tbody>' + rowsHtml + '</tbody></table>';
}

// Quarter-to-quarter clip. Only quarters that exist in the book are offered, so
// there is no way to select an empty range by accident.
function rangePicker(d){
  var qs = d.quarters || [];
  if (qs.length < 2) return '';
  var r = d.range || {};
  var opts = function(sel){
    return '<option value="">any</option>' + qs.map(function(q){
      return '<option value="' + q + '"' + (sel === q ? ' selected' : '') + '>' + q + '</option>';
    }).join('');
  };
  return '<label class="qsel">from <select id="qFrom">' + opts(r.from) + '</select></label>' +
    '<label class="qsel">to <select id="qTo">' + opts(r.to) + '</select></label>' +
    (r.from || r.to ? '<button class="btn small" id="qAll">Clear</button>' : '');
}

function loadAnalysis(){
  $('v-analysis').innerHTML = '<div class="loading">Counting weeks…</div>';
  api('apiAnalysis', [], function(d){ LOADED.analysis = true; renderAnalysis($('v-analysis'), d); });

// ================================================================ RE-PLAN
function renderReplanIdle(){
  LOADED.replan = true;
  $('v-replan').innerHTML =
    '<div class="head"><span class="bar"></span><h2>Re-plan</h2></div>' +
    '<p class="lead">Re-planning never moves dates — deadlines are fixed, so a re-solve only ever ' +
    'changes who. Anything starting this week or earlier is locked, so is anything pinned by hand, ' +
    'and so is any project you have frozen with the lock on the Projects list. ' +
    'Nothing is written until you apply.</p>' +
    '<button class="btn primary" id="rpPreview">Preview re-plan</button><div id="rpOut"></div>';
  $('rpPreview').addEventListener('click', function(){
    $('rpOut').innerHTML = '<div class="loading">Re-solving…</div>';
    api('apiReplanPreview', [], renderReplan);
  });
}

function renderReplan(r){
  if (r.empty) { $('rpOut').innerHTML = '<div class="empty">No committed projects to re-plan.</div>'; return; }
  // Re-plan cannot move work already under way, so as the year fills up it will often
  // have nothing to offer. Saying so is the honest answer — it used to propose the
  // least-bad of its attempts even when every one was worse than the current book.
  if (r.no_improvement) {
    $('rpOut').innerHTML =
      '<div class="banner"><b>Nothing to change.</b> The schedule you have is already the ' +
      'best arrangement available — every alternative tried was the same or worse.</div>' +
      '<p class="muted">Re-plan cannot move work that has already started, so the further ' +
      'into the year you are, the less room it has. This is a normal answer, not a failure.</p>';
    return;
  }
  // Counted from the weeks themselves, not from rows carrying a FORCED note. The note
  // misses any overlap created by a LATER project landing on top, so it under-reports:
  // on the validation book five projects overlap and only two are flagged. The table
  // below is computed the same way, so the headline and the detail cannot disagree.
  var after = r.overlaps_after || [], resolved = r.overlaps_resolved || [];
  var deepAfter = after.filter(function(o){ return o.projects.length > 2; }).length;
  var madeNew = after.filter(function(o){ return o.isNew; }).length;
  var h = '<div class="grid g3" style="margin-top:16px">';
  h += card('Overlapped weeks afterwards', String(after.length),
    (deepAfter ? deepAfter + ' of them at three or more · ' : 'none at three or more · ') +
    resolved.length + ' resolved, ' + madeNew + ' new' +
      (r.forced_locked_rows ? ' · ' + r.forced_locked_rows + ' locked, cannot be undone here' : ''),
    deepAfter > 0);
  // "13 rows locked" said nothing useful when all 13 were locked by the calendar
  // and none by a person. The reasons are different decisions, so they are named.
  var why = [];
  if (r.locked_started) why.push(r.locked_started + ' already under way');
  if (r.locked_frozen) why.push(r.locked_frozen + ' on frozen projects');
  if (r.locked_pinned) why.push(r.locked_pinned + ' set by hand');
  h += card('Assignments that would move', String(r.change_count),
    r.movable_rows + ' rows can move' +
    (why.length ? ' · held: ' + why.join(', ') : ' · nothing is held'), false);
  h += card('Set by hand', String(r.pinned_rows),
    r.pinned_rows ? 'Hand picks and weeks you dragged. Re-plan leaves these alone.'
                  : 'Nothing overridden — re-plan can use the whole book.', r.pinned_rows > 0);
  h += '</div>';
  // "4 forced-overlap booking rows" is true and useless — it does not say who, when,
  // or which titles collide, so there is no way to judge the trade being offered.
  h += overlapTable(r);
  h += '<div class="banner">Two at once is ordinary — a series still recording while its ' +
    'edit starts. Three at once is overflow and wants reassigning. Nothing is written ' +
    'until you apply.</div>';
  if ((r.locked_projects || []).length) {
    h += '<div class="banner"><b>' + r.locked_projects.length + ' project(s) frozen</b> and left ' +
      'untouched: ' + r.locked_projects.map(esc).join(', ') + '. Unlock from the Projects list.</div>';
  }

  if (!r.changes.length) {
    h += '<div class="empty">No changes — the book is already what a re-solve would produce.</div>';
  } else {
    h += '<table><thead><tr><th>Project</th><th>Phase</th><th>From</th><th>To</th></tr></thead><tbody>';
    r.changes.forEach(function(c){
      h += '<tr><td class="tname">' + esc(c.project) + '</td><td>' + esc(c.phase) +
        '</td><td>' + esc(c.from) + '</td><td>' + esc(c.to) + '</td></tr>';
    });
    h += '</tbody></table>';
    h += '<div class="formactions"><button class="btn primary" id="rpApply">Apply re-plan</button>' +
      '<span class="muted" style="margin:0">Reversible — old rows become superseded, never deleted.</span></div>';
  }
  $('rpOut').innerHTML = h;
  if ($('rpApply')) $('rpApply').addEventListener('click', function(){
    $('rpApply').disabled = true;
    api('apiReplanApply', [], function(res){
      if (!res.ok) { toast(res.error || 'Failed'); $('rpApply').disabled = false; return; }
      toast(res.appended + ' rows added, ' + res.superseded + ' superseded. Nothing deleted.', true);
      refreshEverything(res.boot, renderReplanIdle);
    });
  });
}

function card(title, value, sub, warn){
  return '<div class="card' + (warn ? ' flag' : '') + '"><div class="t">' + esc(title) + '</div>' +
    '<div class="stat' + (warn ? ' warn' : '') + '">' + esc(value) + '</div>' +
    '<div class="sub">' + esc(sub) + '</div></div>';
}
</script>
</body>
</html>
