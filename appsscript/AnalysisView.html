<script>
// Analysis rendering. All arithmetic — stats.js and capacity.gs do the work,
// nothing here infers anything. Grouped by the decision each figure answers
// (HANDOFF §7), with the bottleneck first because it is the highest-value page.
//
// Charts are single-series per role: criterion 12 forbids combining the two role
// currencies, which also keeps every chart to one axis.

var TIPEL = null;
function tipOn(e, html){
  TIPEL = TIPEL || document.getElementById('tip');
  TIPEL.innerHTML = html; TIPEL.style.display = 'block'; tipMove(e);
}
function tipMove(e){
  var x = e.clientX + 14, y = e.clientY + 14;
  var r = TIPEL.getBoundingClientRect();
  if (x + r.width > window.innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > window.innerHeight - 8) y = e.clientY - r.height - 14;
  TIPEL.style.left = x + 'px'; TIPEL.style.top = y + 'px';
}
function tipOff(){ if (TIPEL) TIPEL.style.display = 'none'; }

function aEl(tag, attrs, kids){
  var svgTags = {svg:1,g:1,rect:1,line:1,text:1,path:1,circle:1,polyline:1};
  var n = document.createElementNS(svgTags[tag] ? 'http://www.w3.org/2000/svg'
    : 'http://www.w3.org/1999/xhtml', tag);
  for (var k in (attrs||{})) if (attrs[k] !== null && attrs[k] !== undefined) n.setAttribute(k, attrs[k]);
  (kids||[]).forEach(function(c){ n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return n;
}
function aEsc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function renderAnalysis(root, d){
  root.innerHTML = '';
  if (d.problems && d.problems.length) {
    var e = aEl('div',{class:'errs'});
    e.innerHTML = '<b>The Bookings tab has ' + d.problems.length + ' problem(s).</b> ' +
      'Figures below may be wrong until they are fixed.';
    root.appendChild(e);
  }
  if (d.empty) {
    root.appendChild(aEl('div',{class:'empty'},['No bookings yet. Add a project first.']));
    return;
  }

  var cap = d.capacity;

  // Capacity charts start at THIS WEEK. Past weeks cannot be acted on — you cannot
  // hire retroactively — and including them made the axis grow without limit as
  // history accumulated: five years of data would be ~260 bars in the same width,
  // under 2px each, with the month labels colliding all over again. Rolling the
  // start keeps the width at "how far ahead we plan", which is constant year over
  // year. tools/capacity_report.js still prints the full series for a look back.
  var weeks = cap.weeks.filter(function (w) { return w.week_start >= d.today; });
  if (!weeks.length) weeks = cap.weeks;
  var meta = aEl('div',{class:'muted'});
  meta.innerHTML = 'Week of ' + aEsc(d.today) +
    (d.horizon ? ' · horizon ' + aEsc(d.horizon.from) + ' → ' + aEsc(d.horizon.to) +
      ' · ' + d.horizon.weeks + ' weeks' : '');
  root.appendChild(meta);

  // ------------------------------------------------- 1. CAN WE TAKE WORK?
  // The two demand-vs-supply charts replaced four stat tiles and two
  // "tightest weeks" lists: the tiles counted what the charts already draw, and
  // the lists were a top-N of the same series. A chart also shows whether a crunch
  // is one bad week or a sustained quarter, which is the actual hire signal.
  var sec = aSection(root, 'Can we take work?', '');

  // ONE grid per section, so the 20px gap applies between every card. Separate grid
  // wrappers gave gaps inside each wrapper and none across the boundary — invisible
  // while the page was two columns, obvious the moment it became one.
  var g = aEl('div',{class:'grid'});
  sec.appendChild(g);
  g.appendChild(forcedCard(d.forced_overlaps, cap.bottleneck.forced_by_engineer));
  g.appendChild(demandChart(weeks, 'recedit', 'Dub or edit — projects per week',
    'Can do it: ' + cap.pools.recedit.join(', ')));
  g.appendChild(demandChart(weeks, 'adv_mix', 'Advanced mix — projects per week',
    'Can do it: ' + cap.pools.adv_mix.join(', ') + ' · plus ' +
    (cap.pools.adv_mix_incl_overflow.length - cap.pools.adv_mix.length) + ' in reserve'));
  g.appendChild(whosFreeCard(cap.weeks, d.today));
  g.appendChild(clientCard(cap.pipeline.by_client));

  // -------------------------------------------------- 2. WHO IS OVERLOADED?
  // Overloaded means holding TWO projects in one week. It is NOT a long unbroken
  // run: this section used to flag eight-plus consecutive weeks red and call it
  // burnout, which measured having work rather than strain, and would now paint the
  // deliberately-clean plan as a problem (see 20_Config.gs, SOLVE_OBJECTIVE).
  sec = aSection(root, 'Who is overloaded?', '');
  g = aEl('div',{class:'grid'});
  sec.appendChild(g);
  g.appendChild(heatmapCard(d.by_quarter, cap.weeks_per_engineer));
  g.appendChild(overloadCard(d.engineers));

  var foot = aEl('div',{class:'banner'});
  foot.textContent = 'Every figure here counts booking-row weeks, so it reconciles with the schedule ' +
    'grid. If the heatmap says an engineer has 16 weeks, counting their cells in the grid gives 16. ' +
    'Superseded rows are never included.';
  root.appendChild(foot);
}

function aSection(root, title, lead){
  var s = aEl('div',{style:'margin-top:30px'});
  var h = aEl('div',{class:'head'},[aEl('span',{class:'bar'}), aEl('h2',{},[title])]);
  s.appendChild(h);
  if (lead) s.appendChild(aEl('p',{class:'lead'},[lead]));
  root.appendChild(s);
  return s;
}
function aCard(title, value, unit, sub, warn){
  return '<div class="card' + (warn ? ' flag' : '') + '"><div class="t">' + aEsc(title) + '</div>' +
    '<div class="stat' + (warn ? ' warn' : '') + '">' + aEsc(value) +
    (unit ? '<span class="u">' + aEsc(unit) + '</span>' : '') + '</div>' +
    (sub ? '<div class="sub">' + aEsc(sub) + '</div>' : '') + '</div>';
}

// Single series + a dashed supply threshold. One axis, no legend needed — the
// title names the series. Over-capacity weeks are directly labelled.
function demandChart(weeks, role, title, subtitle){
  var W = 1200, H = 210, PL = 42, PR = 10, PT = 14, PB = 34;
  var dKey = role === 'recedit' ? 'recedit_demand_projects' : 'mix_demand_projects';
  var sKey = role === 'recedit' ? 'recedit_supply' : 'adv_mix_supply';
  var oKey = role === 'recedit' ? 'recedit_over' : 'adv_mix_over';
  var freeKey = role === 'recedit' ? 'recedit_free_names' : 'adv_mix_free_names';
  var supply = weeks.length ? weeks[0][sKey] : 0;
  var maxV = Math.max(supply + 1, 1);
  weeks.forEach(function(w){ if (w[dKey] > maxV) maxV = w[dKey]; });

  var iw = W - PL - PR, ih = H - PT - PB;
  var slot = iw / weeks.length;
  var bw = Math.max(2, slot - 2);
  var x = function(i){ return PL + i * slot; };
  var y = function(v){ return PT + ih - (v / maxV) * ih; };

  var svg = aEl('svg',{viewBox:'0 0 ' + W + ' ' + H, width:'100%'});
  for (var t = 0; t <= maxV; t++) {
    if (maxV > 6 && t % 2) continue;
    svg.appendChild(aEl('line',{class:'gridline', x1:PL, x2:W-PR, y1:y(t), y2:y(t)}));
    svg.appendChild(aEl('text',{x:PL-7, y:y(t)+4, 'font-size':13, 'text-anchor':'end'},[String(t)]));
  }
  weeks.forEach(function(w,i){
    var v = w[dKey], over = w[oKey] > 0;
    if (v <= 0) return;
    var r = aEl('rect',{class:'mark', x:x(i), y:y(v), width:bw,
      height:Math.max(1, ih - (y(v) - PT)),
      fill: over ? 'var(--red)' : 'var(--fg2)', 'fill-opacity': over ? 1 : .55});
    r.addEventListener('mouseenter', function(ev){ tipOn(ev,
      '<b>' + aEsc(w.label) + '</b><br>demand ' + v + ' · eligible ' + w[sKey] +
      (over ? '<br><b>over by ' + w[oKey] + '</b>' : '') +
      '<br>free: ' + (w[freeKey].join(', ') || 'nobody')); });
    r.addEventListener('mousemove', tipMove);
    r.addEventListener('mouseleave', tipOff);
    svg.appendChild(r);
    if (over) svg.appendChild(aEl('text',{x:x(i)+bw/2, y:y(v)-5, 'font-size':13,
      'text-anchor':'middle', fill:'var(--red)', 'font-weight':700},['+' + w[oKey]]));
  });
  svg.appendChild(aEl('line',{class:'supply', x1:PL, x2:W-PR, y1:y(supply), y2:y(supply)}));
  svg.appendChild(aEl('text',{x:W-PR, y:y(supply)-6, 'font-size':13, 'text-anchor':'end',
    fill:'var(--fg1)', 'font-weight':700},['eligible supply ' + supply]));
  svg.appendChild(aEl('line',{class:'axis', x1:PL, x2:W-PR, y1:PT+ih, y2:PT+ih}));
  // Month boundaries, not week ranges. Every third bar carried a label like
  // "Dec 28 - Jan 3" and they collided into each other — and week precision on a
  // 57-week axis is noise anyway, since you read a chart this long by month.
  // Derived from the week_start string rather than a Date, so no timezone can shift
  // a week into the wrong month.
  var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var lastKey = null, lastYear = null;
  weeks.forEach(function(w,i){
    var ym = String(w.week_start || '').slice(0, 7);        // YYYY-MM
    if (!ym || ym === lastKey) return;
    lastKey = ym;
    var year = ym.slice(0, 4);
    var text = MON[parseInt(ym.slice(5, 7), 10) - 1];
    if (year !== lastYear) { text += ' ' + year.slice(2); lastYear = year; }
    svg.appendChild(aEl('line',{class:'axis', x1:x(i), x2:x(i), y1:PT+ih, y2:PT+ih+4}));
    svg.appendChild(aEl('text',{x:x(i)+3, y:H-14, 'font-size':12, 'text-anchor':'start'},[text]));
  });

  var c = aEl('div',{class:'card'});
  var head = aEl('div',{class:'cardhead'});
  var left = aEl('div');
  left.innerHTML = '<div class="t">' + aEsc(title) + '</div><div class="s">' + aEsc(subtitle) + '</div>';
  head.appendChild(left);
  var btn = aEl('button',{class:'toggle'},['Table']);
  head.appendChild(btn);
  c.appendChild(head);
  c.appendChild(svg);
  var tv = aEl('div',{class:'tblview'});
  tv.innerHTML = '<table><thead><tr><th>Week</th><th class="n">Demand</th><th class="n">Eligible</th>' +
    '<th class="n">Over</th><th>Free</th></tr></thead><tbody>' +
    weeks.map(function(w){
      return '<tr' + (w[oKey] > 0 ? ' class="rowbad"' : '') + '><td>' + aEsc(w.label) +
        '</td><td class="n">' + w[dKey] + '</td><td class="n">' + w[sKey] +
        '</td><td class="n">' + (w[oKey] || '') + '</td><td>' +
        aEsc(w[freeKey].join(', ') || 'nobody') + '</td></tr>';
    }).join('') + '</tbody></table>';
  c.appendChild(tv);
  btn.addEventListener('click', function(){
    var open = tv.style.display === 'block';
    tv.style.display = open ? 'none' : 'block';
    btn.textContent = open ? 'Table' : 'Hide table';
  });
  return c;
}

// Who is free, week by week, BY NAME.
//
// Replaced a table of "open engineer-weeks per quarter". That number summed free
// weeks across a quarter, which quietly implies capacity is interchangeable across
// TIME — and it is not, because deadlines are fixed. A quarter can show twelve open
// weeks while every week you actually need is full. It is the same error the page
// warns about for roles (criterion 12), one axis over.
//
// Names, because "2 free" prompts a second question and "Mat, Jetrho" does not.
function whosFreeCard(weeks, todayISO){
  var c = aEl('div',{class:'card'});
  var from = weeks.filter(function(w){ return w.week_start >= todayISO; });
  if (!from.length) from = weeks;
  var show = from.slice(0, 10);
  var cell = function(names){
    return names.length
      ? '<td>' + aEsc(names.join(', ')) + '</td>'
      : '<td class="none">nobody free</td>';
  };
  var rows = show.map(function(w){
    return '<tr><td class="wk">' + aEsc(w.label) + '</td>' +
      cell(w.recedit_free_names || []) + cell(w.adv_mix_free_names || []) + '</tr>';
  }).join('');
  c.innerHTML = '<div class="t">Who is free, week by week</div>' +
    '<div class="s">Next ' + show.length + ' weeks</div>' +
    '<table><thead><tr><th>Week</th><th>Free for dub or edit</th><th>Free for Advanced mix</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
  return c;
}
function heatmapCard(byQuarter, perEngineer){
  var quarters = Object.keys(byQuarter).sort();
  var names = {};
  quarters.forEach(function(q){ Object.keys(byQuarter[q]).forEach(function(n){ names[n] = true; }); });
  var engs = Object.keys(names).sort(function(a,b){
    return (perEngineer[b]||0) - (perEngineer[a]||0) || a.localeCompare(b); });
  var max = 1;
  quarters.forEach(function(q){ engs.forEach(function(n){
    var v = byQuarter[q][n] || 0; if (v > max) max = v; }); });
  var ramp = ['var(--r0)','var(--r1)','var(--r2)','var(--r3)','var(--r4)','var(--r5)'];
  var color = function(v){
    if (!v) return 'var(--bg2)';
    return ramp[Math.min(ramp.length-1, Math.floor((v/max) * ramp.length))];
  };
  var c = aEl('div',{class:'card'});
  var head = '<tr><th></th>' + quarters.map(function(q){
    return '<th class="n">' + aEsc(q.replace('20','’')) + '</th>'; }).join('') +
    '<th class="n">Total</th></tr>';
  var body = engs.map(function(n){
    return '<tr><td style="padding-right:12px">' + aEsc(n) + '</td>' +
      quarters.map(function(q){
        var v = byQuarter[q][n] || 0;
        return '<td class="cell" style="background:' + color(v) +
          (v/max > 0.62 ? ';color:#fff' : '') + '">' + (v ? v : '') + '</td>';
      }).join('') +
      '<td class="cell" style="font-weight:700">' + (perEngineer[n]||0) + '</td></tr>';
  }).join('');
  c.innerHTML = '<div class="t">Weeks booked per engineer, per quarter</div>' +
    '<div class="s">Darker = busier</div>' +
    '<table class="hm"><thead>' + head + '</thead><tbody>' + body + '</tbody></table>';
  return c;
}

// Overloaded weeks per engineer. Replaced a "longest unbroken run" column that
// flagged eight-plus consecutive weeks red — a measure of having work, not of
// strain. Only doubled weeks appear here, each naming the projects that collide.
function overloadCard(engineers){
  var c = aEl('div',{class:'card'});
  var loaded = (engineers||[]).filter(function(e){ return (e.double_booked_weeks||[]).length; })
    .sort(function(a,b){ return b.double_booked_weeks.length - a.double_booked_weeks.length ||
      a.engineer.localeCompare(b.engineer); });
  if (!loaded.length) {
    c.innerHTML = '<div class="t">Overloaded weeks</div>' +
      
      '<div class="empty" style="margin:10px 0 0">None — every engineer is on one project at a time.</div>';
    return c;
  }
  var rows = loaded.map(function(e){
    return e.double_booked_weeks.map(function(w, i){
      return '<tr class="rowbad">' +
        '<td>' + (i === 0 ? aEsc(e.engineer) + ' <b>(' + e.double_booked_weeks.length + ')</b>' : '') + '</td>' +
        '<td>' + aEsc(w.week_of) + '</td>' +
        '<td>' + aEsc((w.projects||[]).join('  +  ')) + '</td></tr>';
    }).join('');
  }).join('');
  c.innerHTML = '<div class="t">Overloaded weeks</div>' +
    
    '<table><thead><tr><th>Engineer</th><th>Week of</th><th>Colliding work</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
  return c;
}

// The only commercial view on the page, and not duplicated anywhere else.
function clientCard(byClient){
  var c = aEl('div',{class:'card'});
  var rows = (byClient||[]).map(function(x){
    return '<tr><td>' + aEsc(x.client) + '</td><td class="n">' + x.weeks +
      '</td><td class="n">' + x.projects + '</td></tr>'; }).join('');
  c.innerHTML = '<div class="t">Where the work comes from</div>' +
    
    '<table><thead><tr><th>Client</th><th class="n">Weeks</th><th class="n">Projects</th>' +
    '</tr></thead><tbody>' + rows + '</tbody></table>';
  return c;
}

// Projects the engine could not schedule without doubling someone up. The single
// most actionable thing on this page, so it leads the section rather than trailing
// it as a footnote — which is how it read when this was a .banner in 11px type.
//
// It also replaces a "Flagged rows" table that listed forced overlaps AND manual
// pins together. Pins were dropped: a pin is often the right answer to something the
// tool cannot know — someone on leave, which is not modelled — so counting them
// measured neither a broken rule nor a mistake.
function forcedCard(forced, byEngineer){
  var c = aEl('div',{class:'card'});
  var rows = forced || [];
  if (!rows.length) {
    c.innerHTML = '<div class="t">Overlaps</div>' +
      '<div class="empty" style="margin:10px 0 0">None — every project fits without doubling anyone.</div>';
    return c;
  }
  // Split by depth, and lead with the overflow. Two at once is a series still
  // recording while its edit starts: worth seeing, not worth alarm. Three at once is
  // the thing somebody has to act on, and burying it in a list where every row looked
  // equally urgent is how it stayed unnoticed.
  var deep = rows.filter(function(f){ return (f.depth || 2) > 2; });
  var pair = rows.filter(function(f){ return (f.depth || 2) <= 2; });
  var who = (byEngineer || []).map(function(f){
    return aEsc(f.engineer) + ' (' + f.forced_rows + ')'; }).join(', ');
  var tbl = function(list){
    return '<table><thead><tr><th>Project</th><th>Phase</th><th>Engineer</th><th>Week of</th>' +
      '</tr></thead><tbody>' + list.map(function(f){
        return '<tr' + ((f.depth || 2) > 2 ? ' class="rowbad"' : '') + '><td>' +
          aEsc(f.project) + '</td><td>' + aEsc(f.phase) + '</td><td>' + aEsc(f.engineer) +
          '</td><td>' + aEsc(f.start) + '</td></tr>';
      }).join('') + '</tbody></table>';
  };
  // Counted in WEEKS, not rows. actualOverlaps_ emits one row per colliding booking,
  // so a single week of four read as "4" and sounded like four separate problems.
  var weeksIn = function(list){
    var seen = {};
    list.forEach(function(f){ seen[f.engineer + '|' + f.start] = 1; });
    return Object.keys(seen).length;
  };
  var nDeep = weeksIn(deep), nPair = weeksIn(pair);
  var wk = function(n){ return n + (n === 1 ? ' week' : ' weeks'); };
  var h = '<div class="t">Overlaps</div>' +
    '<div class="s">' + wk(nPair) + ' with two at once, ' + wk(nDeep) +
    ' with three or more · carried by ' + who + '</div>';
  if (nDeep) h += '<div class="s" style="margin-top:10px"><b>Three at once — reassign</b></div>' + tbl(deep);
  if (nPair) h += '<div class="s" style="margin-top:10px">Two at once — normal</div>' + tbl(pair);
  c.innerHTML = h;
  return c;
}
</script>
